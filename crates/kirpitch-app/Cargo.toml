[package]
name = "kirpitch-app"
description = "The Kirpitch desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kirpitch-core = { path = "../kirpitch-core" }
kirpitch-kicad = { path = "../kirpitch-kicad" }
kirpitch-gen-symbol = { path = "../kirpitch-gen-symbol" }
kirpitch-gen-footprint = { path = "../kirpitch-gen-footprint" }
tauri = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-build = "2"

[lib]
name = "kirpitch_app"
path = "src/lib.rs"

[[bin]]
name = "kirpitch-app"
path = "src/main.rs"
