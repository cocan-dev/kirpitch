[package]
name = "kirpitch-app"
description = "The Kirpitch desktop app: the window around the review flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kirpitch-review = { path = "../kirpitch-review" }
kirpitch-models = { path = "../kirpitch-models" }
tauri = "2"

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "kirpitch-app"
path = "src/main.rs"

# Native file dialogs. On Linux they use GTK, which the window needs anyway.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
