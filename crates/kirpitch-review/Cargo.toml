[package]
name = "kirpitch-review"
description = "The review flow behind the Kirpitch desktop app (no window code)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kirpitch-core = { path = "../kirpitch-core" }
kirpitch-kicad = { path = "../kirpitch-kicad" }
kirpitch-gen-symbol = { path = "../kirpitch-gen-symbol" }
kirpitch-gen-footprint = { path = "../kirpitch-gen-footprint" }
kirpitch-gen-3d = { path = "../kirpitch-gen-3d" }
kirpitch-extract = { path = "../kirpitch-extract" }
serde = { version = "1.0.229", features = ["derive"] }
