[package]
name = "kirpitch-cli"
description = "The kirpitch command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "kirpitch"
path = "src/main.rs"

[dependencies]
kirpitch-core = { path = "../kirpitch-core" }
kirpitch-kicad = { path = "../kirpitch-kicad" }
kirpitch-gen-symbol = { path = "../kirpitch-gen-symbol" }
kirpitch-gen-footprint = { path = "../kirpitch-gen-footprint" }
kirpitch-gen-3d = { path = "../kirpitch-gen-3d" }
kirpitch-extract = { path = "../kirpitch-extract" }
kirpitch-models = { path = "../kirpitch-models" }
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
