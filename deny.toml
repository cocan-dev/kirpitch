# cargo-deny configuration: licence, advisory, ban and source checks.
# Only licences compatible with GPL-3.0-or-later are allowed.

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
